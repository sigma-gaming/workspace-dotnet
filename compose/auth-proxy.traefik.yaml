tls:
  certificates:
    - certFile: /ssl/local.crt
      keyFile: /ssl/local.key

entryPoints:
  web:
    address: ":443"
    http:
      tls: {}

http:
  routers:
    auth-app:
      rule: "Host(`auth.local`)"
      entryPoints:
        - web
      service: auth-app
      tls: {}
    auth-api:
      rule: "Host(`api.auth.local`)"
      entryPoints:
        - web
      service: auth-api
      tls: {}

  services:
    auth-app:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4321"
    auth-api:
      loadBalancer:
        servers:
          - url: "https://host.docker.internal:5140"