name: Build development images with Google Cloud Build

on:
  push:
    branches: [ 'main' ]
  workflow_dispatch:
    inputs:
      from:
        description: SHA for base commit to find affected apps

env:
  DOCKER_REGISTRY: europe-west4-docker.pkg.dev/${{ secrets.GCLOUD_PROJECT_ID }}/docker

concurrency:
  group: ${{ github.workflow }}

jobs:
  timestamp:
    name: Get current unix timestamp
    runs-on: [ ubuntu-22.04 ]

    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}

    steps:
      - name: Get current unix timestamp
        id: timestamp
        uses: release-kit/unix-timestamp@v1

  affected:
    name: Get affected apps
    runs-on: [ ubuntu-22.04 ]

    outputs:
      apps: ${{ steps.affected.outputs.affected }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Derive appropriate SHAs for base and head for `nx affected` commands
        id: shas
        uses: nrwl/nx-set-shas@v4

      - uses: leonardochaia/dotnet-affected-action@v1.4
        id: affected
        with:
          from: ${{ github.event.inputs.from || steps.shas.outputs.base }}
          to: ${{ steps.shas.outputs.head }}

      - name: Install dependencies
        if: steps.affected.outputs.affected != ''
        run: dotnet restore affected.proj

      - name: Build
        if: steps.affected.outputs.affected != ''
        run: dotnet build --configuration Release --no-restore affected.proj

      - name: Test
        if: steps.affected.outputs.affected != ''
        run: dotnet test --no-restore affected.proj
  
  build-in-cloud:
    name: Build Docker Images in Google Cloud
    runs-on: [ ubuntu-22.04 ]
    needs: [ timestamp, affected ]
    if: ${{ needs.affected.outputs.apps != '' }}  # Если нет затронутых проектов, пропускаем

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Gcloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCLOUD_PROJECT_ID }}
          skip_install: true

      - name: Generate cloudbuild.yaml
        id: generate-cloudbuild
        run: |
          affected_apps="${{ needs.affected.outputs.apps }}"
          filtered=$(echo "$affected_apps" | grep "/src/Apps/" || true)

          if [ -z "$filtered" ]; then
            echo "No affected apps found in src/Apps."
            exit 0
          fi

          TIMESTAMP="${{ needs.timestamp.outputs.timestamp }}"
          BASE_CACHE_IMAGE="${DOCKER_REGISTRY}/base-cache"

          echo "steps:" > cloudbuild.yaml
          
          cat <<EOF >> cloudbuild.yaml
          - name: "gcr.io/cloud-builders/docker"
            id: "build-base"
            waitFor: ["-"]
            env:
              - "DOCKER_BUILDKIT=1"
            args:
              - build
              - --target=build
              - --tag=${BASE_CACHE_IMAGE}
              - .
          EOF

          cat <<EOF >> cloudbuild.yaml
          - name: "gcr.io/cloud-builders/docker"
            id: "push-base"
            waitFor: ["build-base"]
            env:
              - "DOCKER_BUILDKIT=1"
            args:
              - push
              - ${BASE_CACHE_IMAGE}
          EOF

          echo "images:" >> cloudbuild.yaml
          
          while IFS= read -r project; do
          project_name=$(basename "$project" .csproj)
          app_name_lower=$(echo "$project_name" | sed 's/\./-/g' | tr '[:upper:]' '[:lower:]')
          
          IMAGE="${DOCKER_REGISTRY}/${app_name_lower}"
          
          cat <<EOF >> cloudbuild.yaml

          - name: "gcr.io/cloud-builders/docker"
            id: "build-${app_name_lower}"
            waitFor: ["push-base"]
            env:
              - "DOCKER_BUILDKIT=1"
            args:
              - build
              - --cache-from=${BASE_CACHE_IMAGE}
              - --build-arg=APP_NAME=${project_name}
              - --target=final
              - --tag=${IMAGE}:latest
              - --tag=${IMAGE}:dev-${TIMESTAMP}
              - --build-arg=sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
              - --build-arg=sentry_release=dev-${TIMESTAMP}
              - .
          EOF
          
          echo "  - ${IMAGE}:latest" >> cloudbuild.yaml
          echo "  - ${IMAGE}:dev-${TIMESTAMP}" >> cloudbuild.yaml
          
          done <<< "$filtered"
          
          echo "===== Generated cloudbuild.yaml ====="
          cat cloudbuild.yaml
